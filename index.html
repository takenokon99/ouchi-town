<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2dfe1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>おうちタウン</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg id="world" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMin meet"></svg>

<div id="ui">
  <button id="btn-dress" class="round big" aria-label="きがえ">
    <svg viewBox="0 0 64 64"><path d="M32 14 a6 6 0 1 1 6 6 c-3 0-6 2-6 5 l0 3 L8 44 c-3 2-2 6 2 6 h44 c4 0 5-4 2-6 L32 28" fill="none" stroke="#4a3a42" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="btn-gear" class="round small" aria-label="せってい">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="9" fill="none" stroke="#4a3a42" stroke-width="5"/><path d="M32 8v8M32 48v8M8 32h8M48 32h8M15 15l6 6M43 43l6 6M15 49l6-6M43 21l6-6" stroke="#4a3a42" stroke-width="5" stroke-linecap="round"/></svg>
  </button>
</div>

<div id="dress" hidden>
  <div class="stage"></div>
  <div class="side">
    <div class="who"></div>
    <div class="tabs"></div>
    <div class="opts"></div>
  </div>
  <button id="dress-close" class="round big ok" aria-label="できた">✓</button>
</div>

<div id="settings" hidden>
  <div class="card">
    <button id="btn-full" class="wide">ぜんがめん</button>
    <label class="wide file">キャラファイルを よみこむ<input id="pack-file" type="file" hidden></label>
    <button id="btn-reset" class="wide danger">ながおしで はじめから</button>
    <button id="settings-close" class="wide">とじる</button>
  </div>
</div>

<div id="rotate">📱 よこに してね</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
